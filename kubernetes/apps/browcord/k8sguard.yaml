apiVersion: v1
kind: ServiceAccount
metadata:
  name: browcord-k8sguard
  namespace: browcord
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: browcord-k8sguard
  namespace: browcord-rooms
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: browcord-k8sguard
  namespace: browcord-rooms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: browcord-k8sguard
subjects:
  - kind: ServiceAccount
    name: browcord-k8sguard
    namespace: browcord
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browcord-k8sguard
  namespace: browcord
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: browcord-k8sguard
  template:
    metadata:
      labels:
        app: browcord-k8sguard
    spec:
      serviceAccountName: browcord-k8sguard
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k8sguard
          image: ghcr.io/mmrmagno/browcord-gateway:latest@sha256:48e387661b0c0c88cac35de44a5311dd8b111e54b3015920b436a050e3773d99
          command: [/app/k8sguard]
          ports:
            - {name: http, containerPort: 7070}
          env:
            - {name: ROOM_IMAGE, value: "ghcr.io/mmrmagno/browcord-room:latest@sha256:4a4910abde89bc4fc4370a8d12278badde6a899cf1ea4cf82d4eef48dd1b5aa9"}
            - {name: ROOM_NAMESPACE, value: browcord-rooms}
            - {name: ROOM_GATEWAY_URL, value: "ws://browcord-gateway.browcord.svc.cluster.local:8080"}
            - {name: ROOM_SECCOMP_PROFILE, value: profiles/browcord-chromium.json}
            - {name: ROOM_CAP, value: "2"}
            - {name: ROOM_CEILING, value: 6h10m}
            - {name: ROOM_WIDTH, value: "1280"}
            - {name: ROOM_HEIGHT, value: "720"}
            - {name: ROOM_FPS, value: "30"}
            - {name: ROOM_BITRATE_KBPS, value: "4000"}
            - {name: ROOM_ENCODER, value: vp8enc}
            - {name: ROOM_START_URL, value: "https://duckduckgo.com"}
            - {name: ROOM_STALL_SECONDS, value: "30"}
            - name: GUARD_TOKEN
              valueFrom:
                secretKeyRef: {name: browcord-gateway, key: BROWCORD_GUARD_TOKEN}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: browcord-k8sguard
  namespace: browcord
spec:
  selector:
    app: browcord-k8sguard
  ports:
    - {name: http, port: 7070, targetPort: http}
