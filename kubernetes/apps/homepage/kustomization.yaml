apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: homepage-config
    files:
      - config/settings.yaml
      - config/kubernetes.yaml
      - config/services.yaml
      - config/widgets.yaml
      - config/bookmarks.yaml
      - config/docker.yaml
      - config/proxmox.yaml
      - config/custom.css
      - config/custom.js
  - name: homepage-fonts
    files:
      - fonts/JetBrainsMono-Regular.woff2
      - fonts/JetBrainsMono-Bold.woff2
  - name: homepage-icons
    files:
      - icons/merchant.webp
      - icons/osty.webp
      - icons/valart.svg
