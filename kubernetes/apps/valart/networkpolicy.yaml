apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valart
spec:
  podSelector:
    matchLabels:
      app: valart
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - {protocol: TCP, port: 8080}
  egress: []
