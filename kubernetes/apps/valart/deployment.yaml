apiVersion: apps/v1
kind: Deployment
metadata:
  name: valart
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: valart
  template:
    metadata:
      labels:
        app: valart
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/mmrmagno/valart:latest@sha256:2aee61d5f79c3e8b842083ba08ac230dd4d44d5efed33e49922ca2d2671769b2
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 20Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 2Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
