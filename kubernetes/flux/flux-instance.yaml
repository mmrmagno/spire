apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  distribution:
    version: "2.9.x"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    networkPolicy: true
    domain: cluster.local
  kustomize:
    patches:
      - target:
          kind: NetworkPolicy
          name: allow-scraping
        patch: |
          - op: replace
            path: /spec/ingress/0/from
            value:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
      - target:
          kind: NetworkPolicy
          name: allow-webhooks
        patch: |
          $patch: delete
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-webhooks
  sync:
    kind: GitRepository
    url: https://github.com/mmrmagno/spire.git
    ref: refs/heads/main
    path: kubernetes/flux
    interval: 1m
