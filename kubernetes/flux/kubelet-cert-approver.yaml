apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kubelet-serving-cert-approver
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/alex1989hu/kubelet-serving-cert-approver
  ref:
    tag: v0.12.1
  ignore: |
    /*
    !/deploy/standalone-install.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubelet-serving-cert-approver
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./deploy
  sourceRef:
    kind: GitRepository
    name: kubelet-serving-cert-approver
  prune: true
  wait: true
