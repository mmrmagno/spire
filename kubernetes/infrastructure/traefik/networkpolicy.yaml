apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.0.0/24
        - ipBlock:
            cidr: 10.10.10.0/24
        - ipBlock:
            cidr: 100.64.0.0/10
      ports:
        - port: 8000
        - port: 8443
