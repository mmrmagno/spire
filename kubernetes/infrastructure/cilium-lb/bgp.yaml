apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: merchant
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  bgpInstances:
    - name: spire
      localASN: 64513
      peers:
        - name: merchant
          peerASN: 64512
          peerAddress: 10.10.10.1
          peerConfigRef:
            name: merchant
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: merchant
spec:
  timers:
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  gracefulRestart:
    enabled: true
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: loadbalancer-ips
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - key: bgp.spire/none
            operator: NotIn
            values: ["never"]
