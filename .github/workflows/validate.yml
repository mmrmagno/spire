name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

jobs:
  manifests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Only README.md as markdown
        run: |
          if git ls-files '*.md' | grep -vx 'README.md'; then
            echo "working documents must never be committed" >&2
            exit 1
          fi

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Build and validate every Flux path
        run: |
          set -euo pipefail
          for dir in kubernetes/flux kubernetes/infrastructure kubernetes/infrastructure-config kubernetes/apps; do
            echo "::group::$dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary -skip Secret \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
